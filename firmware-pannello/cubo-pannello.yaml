interval:
  - interval: 1s                  # v8: durata della chiamata e conto alla rovescia del timer
    then:
      - if:
          condition:
            lambda: |-
              auto pg = id(lcd).get_active_page();
              if (id(timer_stato) == 1 && (int32_t) (id(timer_fine) - millis()) <= 0) id(timer_stato) = 0;
              return pg == id(pagina_in_chiamata) || (pg == id(pagina_orologio) && id(timer_stato) == 1);
          then: [component.update: lcd]

http_request:                     # v9: per scaricare la copertina
  verify_ssl: false
  timeout: 10s

image:
  - platform: online_image          # v9
    id: copertina
    url: "${ha_url}/local/copertina_vuota.jpg"   # mai scaricata: l'URL vero arriva da HA
    format: AUTO
    type: RGB565
    resize: 150x150
    on_download_finished:
      - lambda: 'id(cop_ok) = true;'
      - if:
          condition: {lambda: 'return id(lcd).get_active_page() == id(pagina_musica);'}
          then: [component.update: lcd]
    on_error:
      - lambda: 'id(cop_ok) = false;'
      - logger.log: "copertina: scaricamento fallito"

time:
  - platform: homeassistant
    id: ora
    on_time:
      - seconds: 0
        then:
          - if:
              condition: {lambda: 'return id(lcd).get_active_page() == id(pagina_orologio);'}
              then: [component.update: lcd]
          - script.execute: aggiorna_luce

globals:
  - {id: msg_mittente, type: std::string, initial_value: '""'}
  - {id: msg_testo, type: std::string, initial_value: '""'}
  - {id: chi_chiama, type: std::string, initial_value: '""'}
  - {id: msg_risposta, type: bool, initial_value: 'false'}
  - {id: sveglio_fino, type: uint32_t, initial_value: '0'}   # v6: fino a quando (millis) resta la luce piena dopo un tocco
  - {id: g_ora_notte, type: int, restore_value: true, initial_value: '${ora_notte}'}     # v7: modificabili dal menu, ricordati
  - {id: g_ora_giorno, type: int, restore_value: true, initial_value: '${ora_giorno}'}
  - {id: g_luce_giorno, type: float, restore_value: true, initial_value: '1.0'}
  - {id: non_letto, type: bool, initial_value: 'false'}       # v8: busta sull'orologio
  - {id: inizio_chiamata, type: uint32_t, initial_value: '0'} # v8: per la durata a schermo
  - {id: timer_fine, type: uint32_t, initial_value: '0'}      # v8: millis() della fine del timer
  - {id: timer_stato, type: int, initial_value: '0'}          # v8: 0 nessuno, 1 in corso, 2 finito
  - {id: g_lampo, type: int, initial_value: '0'}              # v8: tasto appena toccato (lampo di 200 ms)
  - {id: cop_ok, type: bool, initial_value: 'false'}          # v9: copertina scaricata e valida
  - {id: cambio_ms, type: uint32_t, initial_value: '0'}       # v9c: ultimo cambio pagina
  - {id: cop_chiave, type: std::string, initial_value: '""'}  # v9: identita' della copertina (senza il token che HA cambia)

script:
  - id: aggiorna_luce             # v6: luce piena o notturna, secondo ora / pagina / tocco recente
    mode: queued
    then:
      - if:
          condition:
            lambda: |-
              if (!id(oscuramento_notturno).state) return false;
              if (id(lcd).get_active_page() != id(pagina_orologio)) return false;
              if (millis() < id(sveglio_fino)) return false;
              auto t = id(ora).now();
              if (!t.is_valid()) return false;
              return t.hour >= id(g_ora_notte) || t.hour < id(g_ora_giorno);
          then:
            - light.turn_on:
                id: retro
                brightness: ${luce_notte}
          else:
            - light.turn_on:
                id: retro
                brightness: !lambda 'return id(g_luce_giorno);'
  - id: lampo                     # v8: il tasto toccato si illumina per 200 ms
    mode: restart
    parameters: {n: int}
    then:
      - lambda: 'id(g_lampo) = n;'
      - component.update: lcd
      - delay: 200ms
      - lambda: 'id(g_lampo) = 0;'
      - component.update: lcd
  - id: pressione_lunga           # v7: 3 s fermi sul nome della stanza = menu
    mode: restart
    then:
      - delay: 3s
      - display.page.show: pagina_menu
      - component.update: lcd
      - script.execute: aggiorna_luce
      - script.execute: {id: torna_all_orologio, secondi: 30}
  - id: musica_cambiata           # v7: apre/chiude da sola la pagina della musica
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(lcd).get_active_page() == id(pagina_musica) || id(lcd).get_active_page() == id(pagina_menu);'}
          then: [component.update: lcd]
      - if:
          condition: {lambda: 'return id(mus_stato).state == "playing" && id(lcd).get_active_page() == id(pagina_orologio);'}
          then:
            - display.page.show: pagina_musica
            - component.update: lcd
            - script.execute: aggiorna_luce
      - if:
          condition: {lambda: 'auto s = id(mus_stato).state; return s != "playing" && s != "paused" && id(lcd).get_active_page() == id(pagina_musica);'}
          then:
            - delay: 10s
            - if:
                condition: {lambda: 'auto s = id(mus_stato).state; return s != "playing" && s != "paused" && id(lcd).get_active_page() == id(pagina_musica);'}
                then:
                  - display.page.show: pagina_orologio
                  - component.update: lcd
                  - script.execute: aggiorna_luce
  - id: sveglia                   # v6: un tocco di notte = 30 s di luce piena
    mode: restart
    then:
      - lambda: 'id(sveglio_fino) = millis() + 30000;'
      - script.execute: aggiorna_luce
      - delay: 31s
      - script.execute: aggiorna_luce
  - id: torna_all_orologio
    mode: restart
    parameters: {secondi: int}
    then:
      - delay: !lambda 'return secondi * 1000;'
      - script.stop: squillo
      - switch.turn_off: cicalino
      - display.page.show: pagina_orologio
      - component.update: lcd
      - script.execute: sveglia
  - id: squillo
    mode: restart
    then:
      - repeat:
          count: 20
          then:
            - switch.turn_on: cicalino
            - delay: 300ms
            - switch.turn_off: cicalino
            - delay: 700ms

font:
  # v5: Montserrat (era Roboto). Gli stessi id di prima, piu' font_titolo per il nome della postazione.
  - {file: {type: gfonts, family: Montserrat, weight: 500}, id: font_grande, size: 120, glyphsets: [GF_Latin_Core]}
  - {file: {type: gfonts, family: Montserrat, weight: 600}, id: font_grande_nome, size: 64, glyphsets: [GF_Latin_Core]}
  - {file: {type: gfonts, family: Montserrat, weight: 500}, id: font_media, size: 40, glyphsets: [GF_Latin_Core]}
  - {file: {type: gfonts, family: Montserrat, weight: 400}, id: font_piccola, size: 30, glyphsets: [GF_Latin_Core]}
  - {file: {type: gfonts, family: Montserrat, weight: 600}, id: font_titolo, size: 40, glyphsets: [GF_Latin_Core]}
  - {file: {type: gfonts, family: Montserrat, weight: 600}, id: font_bottone, size: 32, glyphsets: [GF_Latin_Core]}
  - {file: {type: gfonts, family: Montserrat, weight: 400}, id: font_nota, size: 24, glyphsets: [GF_Latin_Core]}
  # v5b: icona del telefono che squilla (Material Design Icons 7.4.47, solo quel glifo)
  - file: {type: web, url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"}
    id: icona_piccola            # v6: non disturbare (pieno / contorno)
    size: 44
    glyphs: ["\U000F0376", "\U000F0377", "\U000F075E", "\U000F075D", "\U000F01EE", "\U000F051B"]   # v7: + volume; v8: + busta, timer
  - file: {type: web, url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"}
    id: icona_mini               # v8: sveglia sull'orologio
    size: 28
    glyphs: ["\U000F0020"]
  - file: {type: web, url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"}
    id: icona_grande             # v7: precedente / pausa / play / successivo
    size: 72
    glyphs: ["\U000F04AE", "\U000F03E4", "\U000F040A", "\U000F04AD"]
  - file: {type: web, url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"}
    id: icona_telefono
    size: 72
    glyphs: ["\U000F11AB", "\U000F03F6", "\U000F03F5"]   # v8: + in conversazione, riaggancia

sensor:
  # v5: temperatura della stanza, letta da HA. Con l'entita' segnaposto resta NaN e la pagina scrive «--,- °C».
  - platform: homeassistant
    id: temp_stanza
    entity_id: ${sensore_temperatura}
    internal: true
    on_value:
      - if:
          condition: {lambda: 'return id(lcd).get_active_page() == id(pagina_orologio);'}
          then: [component.update: lcd]
  # v7: musica (lettore di Music Assistant del cubo) e diagnostica per la pagina Informazioni
  - platform: homeassistant
    id: mus_volume
    entity_id: ${lettore_musica}
    attribute: volume_level
    internal: true
    on_value: [script.execute: musica_cambiata]
  - platform: homeassistant         # v8: temperatura esterna (segnaposto: «--» e la riga resta come prima)
    id: temp_esterna
    entity_id: ${sensore_esterno}
    internal: true
    on_value:
      - if:
          condition: {lambda: 'return id(lcd).get_active_page() == id(pagina_orologio);'}
          then: [component.update: lcd]
  - platform: homeassistant         # v8: timer del PE (secondi rimasti; 0 nessuno; -1 finito)
    id: timer_pe
    entity_id: ${sensore_timer}
    internal: true
    on_value:
      - lambda: |-
          if (std::isnan(x) || x == 0) id(timer_stato) = 0;
          else if (x < 0) id(timer_stato) = 2;
          else { id(timer_stato) = 1; id(timer_fine) = millis() + (uint32_t) (x * 1000); }
      - if:
          condition: {lambda: 'return id(lcd).get_active_page() == id(pagina_orologio);'}
          then: [component.update: lcd]
  - platform: wifi_signal
    id: segnale
    internal: true
    update_interval: 60s

text_sensor:
  - platform: homeassistant         # v8: ora della sveglia («07:00:00»)
    id: sveglia_ora_ha
    entity_id: ${sveglia_ora}
    internal: true
    on_value: [component.update: lcd]
  - platform: homeassistant
    id: mus_stato
    entity_id: ${lettore_musica}
    internal: true
    on_value: [script.execute: musica_cambiata]
  - platform: homeassistant
    id: mus_titolo
    entity_id: ${lettore_musica}
    attribute: media_title
    internal: true
    on_value: [script.execute: musica_cambiata]
  - platform: homeassistant
    id: mus_artista
    entity_id: ${lettore_musica}
    attribute: media_artist
    internal: true
    on_value: [script.execute: musica_cambiata]
  - platform: homeassistant         # v9: copertina del brano (percorso del proxy di HA, o URL esterno)
    id: mus_copertina
    entity_id: ${lettore_musica}
    attribute: entity_picture
    internal: true
    on_value:
      - lambda: |-
          // HA cambia il token nell'URL ogni pochi minuti: la copertina si riscarica solo se cambia la parte «cache=»
          std::string k = x; size_t c = x.find("cache="); if (c != std::string::npos) k = x.substr(c);
          if (x.empty() || x == "unknown" || x == "None") { id(cop_ok) = false; id(cop_chiave) = ""; }
          else if (k != id(cop_chiave)) { id(cop_chiave) = k; id(cop_ok) = false; }
          else return;
      - if:
          condition: {lambda: 'return !id(cop_chiave).empty() && !id(cop_ok);'}
          then:
            - online_image.set_url:
                id: copertina
                url: !lambda 'return x.rfind("http", 0) == 0 ? x : std::string("${ha_url}") + x;'
      - if:
          condition: {lambda: 'return id(lcd).get_active_page() == id(pagina_musica);'}
          then: [component.update: lcd]
  - platform: wifi_info
    ip_address:
      id: mio_ip
      internal: true
