# PANNELLO DEL CUBO DI VIOLA - Waveshare ESP32-S3-Touch-LCD-4 (rev 4.0), ESPHome 2026.9.x
# Solo schermo e tocco: l'audio e' del Voice PE. Il pannello NON conosce i nomi delle entita' di Home Assistant:
# HA gli parla con poche azioni (pannello_messaggio, pannello_risposta, pannello_squilla, pannello_in_chiamata,
# pannello_sveglia, pannello_chiudi) e lui risponde con UN evento (esphome.banco_pannello).
# Funzioni: orologio con nome della stanza e temperature, non disturbare, oscuramento notturno, messaggi fra stanze
# con conferma di lettura, chiamate fra stanze, pagina musica con copertina (Music Assistant), timer del Voice PE,
# sveglia, menu impostazioni con pressione lunga.
# ATTENZIONE, prima di usarlo in casa: qui non ci sono cifratura dell'API ne' password OTA, e se perde la rete il
# pannello apre un access point senza password. Aggiungi `api: encryption:`, `ota: password:` e `wifi: ap: password:`.
# Il Wi-Fi si configura al primo avvio con improv (USB): nel file non ci sono credenziali.
# Stato: prototipo da banco. Le sostituzioni qui sotto vanno adattate alla tua casa.
substitutions:
  nome: cubo-pannello-1          # secondo pannello: cubo-pannello-2
  etichetta: "Pannello 1"
  pe_associato: camera                # a quale PE appartiene: viaggia nell'evento verso HA
  postazione: "Camera"                # v5: nome scritto in alto sull'orologio
  sensore_temperatura: sensor.temperatura_da_definire   # v5: SEGNAPOSTO. Finche' l'entita' non esiste, a schermo «--,- °C»
  ora_notte: "22"                     # v6: dalle 22 ...
  ora_giorno: "7"                     # ... alle 7 lo schermo dell'orologio si abbassa (se «Oscuramento notturno» e' acceso)
  luce_notte: "0.08"                  # v6: luminosita' di notte (0-1)
  lettore_musica: media_player.musica_camera        # lettore di Music Assistant del cubo
  altra_stanza: "Cucina"              # v7: il tasto «Chiama ...» del menu
  altra_pe: cucina                    # v7: ... e il PE da chiamare (viaggia nell'evento `chiama`)
  versione: "v9d del 11/10/2026"
  ha_url: "http://homeassistant.local:8123"       # indirizzo di Home Assistant visto dal pannello (per scaricare la copertina)
  sensore_esterno: sensor.temperatura_esterna_da_definire   # v8: SEGNAPOSTO 
  sensore_timer: sensor.pe_camera_timer_secondi   # v8 (v9b: nome vero)
  sveglia_ora: input_datetime.sveglia_camera                # v8: aiutanti di HA da creare (ora sola, senza data)
  sveglia_attiva: input_boolean.sveglia_camera

esphome:
  name: ${nome}
  friendly_name: ${etichetta}
  on_boot:
    - priority: 600
      then:
        - switch.turn_off: cicalino    # senza questo il cicalino resta acceso dopo l'avvio (problema noto della rev 4.0)

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO           # v3: log normale (DEBUG servi solo alla prima prova)

api:
  actions:
    - action: pannello_messaggio
      variables: {mittente: string, testo: string, secondi: int}
      then:
        - lambda: |-
            id(msg_mittente) = mittente; id(msg_testo) = testo; id(msg_risposta) = false; id(non_letto) = true;
            id(torna_all_orologio).stop();
            id(torna_all_orologio).execute((int) secondi);
        - display.page.show: pagina_messaggio
        - component.update: lcd
        - script.execute: aggiorna_luce
    - action: pannello_risposta        # v4: stessa pagina, ma il tocco NON dice «ha letto» a nessuno
      variables: {mittente: string, testo: string, secondi: int}
      then:
        - lambda: |-
            id(msg_mittente) = mittente; id(msg_testo) = testo; id(msg_risposta) = true;
            id(torna_all_orologio).stop();
            id(torna_all_orologio).execute((int) secondi);
        - display.page.show: pagina_messaggio
        - component.update: lcd
        - script.execute: aggiorna_luce
    - action: pannello_squilla
      variables: {chiamante: string, secondi: int}
      then:
        - if:                              # v6: con Non disturbare acceso lo squillo non si mostra (HA lo sa dall'entita')
            condition: {switch.is_on: non_disturbare}
            then: [lambda: 'ESP_LOGI("pannello", "squillo ignorato: non disturbare");']
            else:
              - lambda: 'id(chi_chiama) = chiamante;'
              - display.page.show: pagina_chiamata
              - component.update: lcd
              - script.execute: aggiorna_luce
              - script.stop: torna_all_orologio
              - if:
                  condition: {switch.is_on: cicalino_nello_squillo}
                  then: [script.execute: squillo]
              - script.execute:
                  id: torna_all_orologio
                  secondi: !lambda 'return secondi;'
    - action: pannello_in_chiamata     # v8: HA la chiama sul pannello di chi ha CHIAMATO quando l'altro accetta
      variables: {con: string}
      then:
        - lambda: 'id(chi_chiama) = con; id(inizio_chiamata) = millis();'
        - script.stop: torna_all_orologio
        - script.stop: squillo
        - switch.turn_off: cicalino
        - display.page.show: pagina_in_chiamata
        - component.update: lcd
        - script.execute: aggiorna_luce
    - action: pannello_sveglia          # v8: HA la chiama quando la sveglia suona
      then:
        - script.stop: torna_all_orologio
        - display.page.show: pagina_sveglia_suona
        - component.update: lcd
        - script.execute: aggiorna_luce
        - script.execute: {id: torna_all_orologio, secondi: 600}
    - action: pannello_chiudi
      then:
        - script.stop: squillo
        - switch.turn_off: cicalino
        - display.page.show: pagina_orologio
        - component.update: lcd

ota:
  - platform: esphome

wifi:
  ap: {}                                # nessuna credenziale nel file: si configura con improv USB / portale
improv_serial:
captive_portal:

i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO7
    frequency: 400kHz
    scan: true

spi:
  - id: spi_lcd
    clk_pin: GPIO2
    mosi_pin: GPIO1

waveshare_io_ch32v003:
  - id: espansore
    address: 0x24
    i2c_id: bus_a

output:
  - platform: waveshare_io_ch32v003
    id: pwm_retro
    waveshare_io_ch32v003_id: espansore
    inverted: true
    zero_means_zero: true
    safe_pwm_levels: {min_value: 0, max_value: 247}

light:
  - platform: monochromatic
    name: "Retroilluminazione"
    id: retro
    output: pwm_retro
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

switch:
  - platform: template
    id: non_disturbare
    name: "Non disturbare"
    icon: mdi:minus-circle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on: [component.update: lcd]
    on_turn_off: [component.update: lcd]
  - platform: template
    id: oscuramento_notturno
    name: "Oscuramento notturno"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on: [script.execute: aggiorna_luce]
    on_turn_off: [script.execute: aggiorna_luce]
  - platform: template
    id: cicalino_nello_squillo
    name: "Cicalino nello squillo"
    icon: mdi:bell-ring
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: cicalino
    name: "Cicalino"
    pin: {waveshare_io_ch32v003: espansore, number: 6, mode: {output: true}, inverted: false}
    restore_mode: ALWAYS_OFF
    internal: true

display:
  - platform: mipi_rgb
    model: WAVESHARE-4-480X480
    id: lcd
    reset_pin: {waveshare_io_ch32v003: espansore, number: 3}
    pixel_mode: 18bit
    update_interval: 10s   # v2: prima 'never' = schermo mai disegnato finche' HA non mandava l'ora (errore del box 08/10)
    on_page_change:        # v9c: segna il momento del cambio pagina (i tocchi dei 500 ms dopo si ignorano)
      - lambda: 'id(cambio_ms) = millis();'
    auto_clear_enabled: true
    pages:
      - id: pagina_orologio
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));   // v5: cornice doppia (oro + bruno)
          it.print(240, 62, id(font_titolo), Color(214,176,104), TextAlign::CENTER, "${postazione}");
          it.horizontal_line(150, 96, 180, Color(214,176,104));
          if (id(non_letto)) it.print(55, 62, id(icona_piccola), Color(214,176,104), TextAlign::CENTER, "\U000F01EE");   // v8: busta
          if (id(non_disturbare).state) it.print(425, 62, id(icona_piccola), Color(200,40,40), TextAlign::CENTER, "\U000F0376");   // v6: DND acceso
          else it.print(425, 62, id(icona_piccola), Color(90,90,90), TextAlign::CENTER, "\U000F0377");                      // v6: DND spento
          auto t = id(ora).now();
          if (t.is_valid()) {
            it.strftime(240, 215, id(font_grande), Color(255,255,255), TextAlign::CENTER, "%H:%M", t);
            it.strftime(240, 305, id(font_media), Color(170,170,170), TextAlign::CENTER, "%d/%m/%Y", t);
          } else {
            it.print(240, 240, id(font_media), Color(170,170,170), TextAlign::CENTER, "in attesa dell'ora...");
          }
          if (id(sveglia_on).state) {                       // v8: sveglia attiva
            int h = 0, m = 0; sscanf(id(sveglia_ora_ha).state.c_str(), "%d:%d", &h, &m);
            it.print(212, 341, id(icona_mini), Color(214,176,104), TextAlign::CENTER, "\U000F0020");
            it.printf(260, 341, id(font_nota), Color(214,176,104), TextAlign::CENTER, "%02d:%02d", h, m);
          }
          it.horizontal_line(150, 360, 180, Color(70,70,70));
          auto gradi = [](float v, char *b, size_t n) {
            if (std::isnan(v)) snprintf(b, n, "--,-°"); else { snprintf(b, n, "%.1f°", v); for (char *c = b; *c; c++) if (*c == '.') *c = ','; } };
          char b1[16], b2[16];
          if (id(timer_stato) == 1) {                       // v8: timer al posto delle temperature
            int rest = (int) ((int32_t) (id(timer_fine) - millis()) / 1000); if (rest < 0) rest = 0;
            it.print(180, 410, id(icona_piccola), Color(214,176,104), TextAlign::CENTER, "\U000F051B");
            if (rest >= 3600) it.printf(265, 410, id(font_media), Color(214,176,104), TextAlign::CENTER, "%d:%02d:%02d", rest / 3600, rest / 60 % 60, rest % 60);
            else it.printf(265, 410, id(font_media), Color(214,176,104), TextAlign::CENTER, "%02d:%02d", rest / 60, rest % 60);
          } else if (id(timer_stato) == 2) {
            it.print(240, 410, id(font_media), Color(230,60,60), TextAlign::CENTER, "Timer finito");
          } else if (std::isnan(id(temp_esterna).state)) {  // senza esterno: come la v5
            gradi(id(temp_stanza).state, b1, sizeof(b1));
            it.printf(240, 410, id(font_media), Color(255,255,255), TextAlign::CENTER, "%sC", b1);
          } else {                                           // v8: stanza | fuori
            gradi(id(temp_stanza).state, b1, sizeof(b1)); gradi(id(temp_esterna).state, b2, sizeof(b2));
            it.print(150, 398, id(font_media), Color(255,255,255), TextAlign::CENTER, b1);
            it.print(330, 398, id(font_media), Color(255,255,255), TextAlign::CENTER, b2);
            it.print(150, 438, id(font_nota), Color(140,140,140), TextAlign::CENTER, "stanza");
            it.print(330, 438, id(font_nota), Color(140,140,140), TextAlign::CENTER, "fuori");
            it.vertical_line(240, 380, 70, Color(70,70,70));
          }
      - id: pagina_messaggio
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));   // v5: cornice doppia (oro + bruno)
          it.print(240, 70, id(font_bottone), Color(255,190,0), TextAlign::CENTER, id(msg_mittente).c_str());
          // il testo va a capo da solo ogni ~26 caratteri
          std::string r = id(msg_testo); int y = 150; size_t i = 0;
          while (i < r.size() && y < 400) {   // v4: sotto i 400 c'e' la riga dell'invito
            size_t n = std::min<size_t>(22, r.size() - i);   // v5: Montserrat e' piu' largo di Roboto
            if (i + n < r.size()) { size_t sp = r.rfind(' ', i + n); if (sp != std::string::npos && sp > i) n = sp - i; }
            it.print(240, y, id(font_piccola), Color(255,255,255), TextAlign::CENTER, r.substr(i, n).c_str());
            i += n; while (i < r.size() && r[i] == ' ') i++; y += 40;
          }
          it.print(240, 436, id(font_nota), Color(140,140,140), TextAlign::CENTER,
                   id(msg_risposta) ? "Tocca per chiudere" : "Tocca per confermare la lettura");
      - id: pagina_musica             # v7
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));
          it.print(240, 62, id(font_titolo), Color(214,176,104), TextAlign::CENTER, "${postazione}");
          it.horizontal_line(150, 96, 180, Color(214,176,104));
          bool suona = id(mus_stato).state == "playing";
          if (!id(cop_ok)) it.print(240, 122, id(font_nota), Color(140,140,140), TextAlign::CENTER, suona ? "In riproduzione" : "In pausa");
          auto corto = [](std::string x, size_t n) { return x.size() > n ? x.substr(0, n - 1) + "..." : x; };
          float v = id(mus_volume).state;
          if (id(cop_ok)) {                                   // v9: copertina a sinistra, testi a destra
            it.image(40, 112, id(copertina));
            it.rectangle(39, 111, 152, 152, Color(90,72,40));
            std::string tt = id(mus_titolo).state; int y = 120;
            for (int riga = 0; riga < 2 && !tt.empty(); riga++) {
              size_t n = std::min<size_t>(13, tt.size());
              if (n < tt.size()) { size_t sp = tt.rfind(' ', n); if (sp != std::string::npos && sp > 0) n = sp; }
              std::string pezzo = tt.substr(0, n); tt = tt.substr(std::min(n + 1, tt.size()));
              if (riga == 1 && !tt.empty()) pezzo = corto(pezzo + " " + tt, 13);
              it.print(205, y, id(font_bottone), Color(255,255,255), TextAlign::TOP_LEFT, pezzo.c_str()); y += 40;
            }
            it.print(205, y + 4, id(font_nota), Color(170,170,170), TextAlign::TOP_LEFT, corto(id(mus_artista).state, 16).c_str());
            if (!std::isnan(v)) it.printf(205, 236, id(font_nota), Color(140,140,140), TextAlign::TOP_LEFT, "Volume %d%%", (int) (v * 100 + 0.5f));
          } else {                                            // come la v8
            it.print(240, 172, id(font_bottone), Color(255,255,255), TextAlign::CENTER, corto(id(mus_titolo).state, 22).c_str());
            it.print(240, 218, id(font_piccola), Color(170,170,170), TextAlign::CENTER, corto(id(mus_artista).state, 24).c_str());
            if (!std::isnan(v)) it.printf(240, 262, id(font_nota), Color(140,140,140), TextAlign::CENTER, "Volume %d%%", (int) (v * 100 + 0.5f));
          }
          if (id(g_lampo) >= 14 && id(g_lampo) <= 16) { int cx = id(g_lampo) == 14 ? 100 : id(g_lampo) == 15 ? 240 : 380; it.filled_rectangle(cx - 60, 300, 120, 80, Color(90,72,40)); }
          if (id(g_lampo) == 17) it.filled_rectangle(30, 395, 200, 60, Color(90,72,40));
          if (id(g_lampo) == 18) it.filled_rectangle(250, 395, 200, 60, Color(90,72,40));
          it.print(100, 340, id(icona_grande), Color(214,176,104), TextAlign::CENTER, "\U000F04AE");
          it.print(240, 340, id(icona_grande), Color(214,176,104), TextAlign::CENTER, suona ? "\U000F03E4" : "\U000F040A");
          it.print(380, 340, id(icona_grande), Color(214,176,104), TextAlign::CENTER, "\U000F04AD");
          it.rectangle(30, 395, 200, 60, Color(90,72,40)); it.rectangle(250, 395, 200, 60, Color(90,72,40));
          it.print(130, 425, id(icona_piccola), Color(255,255,255), TextAlign::CENTER, "\U000F075E");
          it.print(350, 425, id(icona_piccola), Color(255,255,255), TextAlign::CENTER, "\U000F075D");
      - id: pagina_menu               # v7: pressione lunga sul nome della stanza
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));
          it.print(240, 52, id(font_titolo), Color(214,176,104), TextAlign::CENTER, "Impostazioni");
          auto tasto = [&](int x, int y, const char *t, int n) {
            bool l = id(g_lampo) == n;
            int w = n == 8 ? 420 : 200;
            it.filled_rectangle(x, y, w, 54, l ? Color(214,176,104) : Color(35,30,22)); it.rectangle(x, y, w, 54, Color(214,176,104));
            it.print(x + w / 2, y + 27, id(font_nota), l ? Color(0,0,0) : Color(255,255,255), TextAlign::CENTER, t); };
          char luce[48]; float vv = id(mus_volume).state;
          if (std::isnan(vv)) snprintf(luce, sizeof(luce), "Luce %d%%", (int) (id(g_luce_giorno) * 100 + 0.5f));
          else snprintf(luce, sizeof(luce), "Luce %d%%  ·  Volume %d%%", (int) (id(g_luce_giorno) * 100 + 0.5f), (int) (vv * 100 + 0.5f));
          // v8: cinque righe di tasti alti 54 (era 4 da 70) per fare posto alla Sveglia
          it.print(240, 98, id(font_nota), Color(140,140,140), TextAlign::CENTER, luce);
          tasto(30, 115, "Luce -", 1);         tasto(250, 115, "Luce +", 2);
          tasto(30, 175, "Volume -", 3);       tasto(250, 175, "Volume +", 4);
          tasto(30, 235, "Notte", 5);          tasto(250, 235, "Sveglia", 9);
          tasto(30, 295, id(cicalino_nello_squillo).state ? "Cicalino: sì" : "Cicalino: no", 6);
          tasto(250, 295, "Chiama ${altra_stanza}", 7);
          tasto(30, 355, "Informazioni", 8);
          it.print(240, 443, id(font_bottone), Color(214,176,104), TextAlign::CENTER, "Esci");
      - id: pagina_notte              # v7
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));
          it.print(240, 62, id(font_titolo), Color(214,176,104), TextAlign::CENTER, "Notte");
          it.filled_rectangle(30, 115, 420, 70, id(g_lampo) == 9 ? Color(90,72,40) : Color(35,30,22)); it.rectangle(30, 115, 420, 70, Color(214,176,104));
          it.print(240, 150, id(font_nota), Color(255,255,255), TextAlign::CENTER,
                   id(oscuramento_notturno).state ? "Oscuramento notturno: sì" : "Oscuramento notturno: no");
          auto riga = [&](int y, const char *etichetta, int ore, int n) {
            if (id(g_lampo) == n) it.filled_rectangle(30, y, 90, 70, Color(90,72,40));
            if (id(g_lampo) == n + 1) it.filled_rectangle(360, y, 90, 70, Color(90,72,40));
            it.rectangle(30, y, 90, 70, Color(214,176,104)); it.rectangle(360, y, 90, 70, Color(214,176,104));
            it.print(75, y + 35, id(font_bottone), Color(255,255,255), TextAlign::CENTER, "-");
            it.print(405, y + 35, id(font_bottone), Color(255,255,255), TextAlign::CENTER, "+");
            it.printf(240, y + 35, id(font_piccola), Color(255,255,255), TextAlign::CENTER, "%s %02d:00", etichetta, ore); };
          riga(205, "Inizio", id(g_ora_notte), 10);
          riga(295, "Fine", id(g_ora_giorno), 12);
          it.print(240, 443, id(font_nota), Color(214,176,104), TextAlign::CENTER, "Indietro");
      - id: pagina_info               # v7
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));
          it.print(240, 62, id(font_titolo), Color(214,176,104), TextAlign::CENTER, "Informazioni");
          int y = 130; auto riga = [&](const char *t) { it.print(240, y, id(font_nota), Color(255,255,255), TextAlign::CENTER, t); y += 42; };
          char b[48];
          float w = id(segnale).state;
          if (std::isnan(w)) snprintf(b, sizeof(b), "Wi-Fi: --"); else snprintf(b, sizeof(b), "Wi-Fi: %d dBm", (int) w); riga(b);
          snprintf(b, sizeof(b), "IP: %s", id(mio_ip).state.c_str()); riga(b);
          riga("Versione: ${versione}");
          snprintf(b, sizeof(b), "Notte: %02d-%02d (%s)", id(g_ora_notte), id(g_ora_giorno), id(oscuramento_notturno).state ? "sì" : "no"); riga(b);
          snprintf(b, sizeof(b), "Non disturbare: %s", id(non_disturbare).state ? "sì" : "no"); riga(b);
          snprintf(b, sizeof(b), "Cubo: ${pe_associato}"); riga(b);
          it.print(240, 443, id(font_nota), Color(214,176,104), TextAlign::CENTER, "Indietro");
      - id: pagina_in_chiamata        # v8
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));
          it.print(240, 70, id(font_media), Color(170,170,170), TextAlign::CENTER, "In chiamata con");
          it.print(240, 145, id(font_grande_nome), Color(214,176,104), TextAlign::CENTER, id(chi_chiama).c_str());
          uint32_t sec = (millis() - id(inizio_chiamata)) / 1000;
          it.print(190, 235, id(icona_telefono), Color(214,176,104), TextAlign::CENTER, "\U000F03F6");
          it.printf(290, 235, id(font_media), Color(255,255,255), TextAlign::CENTER, "%02u:%02u", (unsigned) (sec / 60), (unsigned) (sec % 60));
          bool l = id(g_lampo) == 20;
          it.filled_rectangle(30, 300, 420, 140, l ? Color(255,90,90) : Color(170, 0, 0));
          it.print(240, 342, id(icona_telefono), Color(255,255,255), TextAlign::CENTER, "\U000F03F5");
          it.print(240, 410, id(font_bottone), Color(255,255,255), TextAlign::CENTER, "RIAGGANCIA");
      - id: pagina_sveglia            # v8: regolazione dal menu
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));
          it.print(240, 62, id(font_titolo), Color(214,176,104), TextAlign::CENTER, "Sveglia");
          it.filled_rectangle(30, 115, 420, 70, id(g_lampo) == 30 ? Color(90,72,40) : Color(35,30,22)); it.rectangle(30, 115, 420, 70, Color(214,176,104));
          it.print(240, 150, id(font_nota), Color(255,255,255), TextAlign::CENTER, id(sveglia_on).state ? "Sveglia: attiva" : "Sveglia: spenta");
          int h = 7, m = 0; sscanf(id(sveglia_ora_ha).state.c_str(), "%d:%d", &h, &m);
          auto riga = [&](int y, const char *etichetta, int val, int n) {
            if (id(g_lampo) == n) it.filled_rectangle(30, y, 90, 70, Color(90,72,40));
            if (id(g_lampo) == n + 1) it.filled_rectangle(360, y, 90, 70, Color(90,72,40));
            it.rectangle(30, y, 90, 70, Color(214,176,104)); it.rectangle(360, y, 90, 70, Color(214,176,104));
            it.print(75, y + 35, id(font_bottone), Color(255,255,255), TextAlign::CENTER, "-");
            it.print(405, y + 35, id(font_bottone), Color(255,255,255), TextAlign::CENTER, "+");
            it.printf(240, y + 35, id(font_piccola), Color(255,255,255), TextAlign::CENTER, "%s %02d", etichetta, val); };
          riga(205, "Ore", h, 31);
          riga(295, "Minuti", m, 33);
          it.print(240, 443, id(font_nota), Color(214,176,104), TextAlign::CENTER, "Indietro");
      - id: pagina_sveglia_suona      # v8: la sveglia sta suonando
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));
          it.print(240, 70, id(font_media), Color(170,170,170), TextAlign::CENTER, "Sveglia");
          auto t = id(ora).now();
          if (t.is_valid()) it.strftime(240, 165, id(font_grande), Color(214,176,104), TextAlign::CENTER, "%H:%M", t);
          it.filled_rectangle(30, 300, 200, 140, id(g_lampo) == 35 ? Color(240,210,140) : Color(214,176,104));
          it.print(130, 370, id(font_bottone), Color(0,0,0), TextAlign::CENTER, "SPEGNI");
          it.filled_rectangle(250, 300, 200, 140, id(g_lampo) == 36 ? Color(90,90,90) : Color(50,50,50));
          it.print(350, 370, id(font_bottone), Color(255,255,255), TextAlign::CENTER, "+10 min");
      - id: pagina_chiamata
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.rectangle(10, 10, 460, 460, Color(214,176,104)); it.rectangle(11, 11, 458, 458, Color(214,176,104));
          it.rectangle(18, 18, 444, 444, Color(90,72,40));   // v5: cornice doppia (oro + bruno)
          it.print(240, 70, id(font_media), Color(170,170,170), TextAlign::CENTER, "Chiamata da");
          it.print(240, 145, id(font_grande_nome), Color(214,176,104), TextAlign::CENTER, id(chi_chiama).c_str());   // v5b: oro come i titoli
          it.print(240, 235, id(icona_telefono), Color(214,176,104), TextAlign::CENTER, "\U000F11AB");              // v5b: telefono che squilla (mdi-phone-ring)
          it.filled_rectangle(30, 300, 200, 140, Color(0, 150, 0));
          it.print(130, 370, id(font_bottone), Color(255,255,255), TextAlign::CENTER, "ACCETTA");
          it.filled_rectangle(250, 300, 200, 140, Color(170, 0, 0));
          it.print(350, 370, id(font_bottone), Color(255,255,255), TextAlign::CENTER, "RIFIUTA");

